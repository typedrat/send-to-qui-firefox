# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: release
jobs:
  publish:
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      XPI: send-to-qui-${{ needs.release-please.outputs.version }}.xpi
    if: needs.release-please.outputs.release_created == 'true'
    name: Sign and attach the extension
    needs:
      - release-please
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build
        run: nix build .#send-to-qui --print-build-logs
      - name: Install web-ext
        run: nix develop --command bun install --frozen-lockfile
      - env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        name: Sign with addons.mozilla.org
        run: |
          mkdir unpacked
          unzip -q 'result/share/mozilla/extensions/{ec8030f7-c20a-464f-9b0e-13a3a9e97384}/send-to-qui@typedr.at.xpi' -d unpacked
          git archive --format=zip --output=source.zip HEAD
          nix develop --command node_modules/.bin/web-ext sign \
            --source-dir unpacked \
            --channel unlisted \
            --upload-source-code source.zip \
            --artifacts-dir signed \
            --approval-timeout 1800000
          mv signed/*.xpi "$XPI"
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Attach to the GitHub release
        run: gh release upload "$TAG" "$XPI" --clobber
    timeout-minutes: 60
  release-please:
    name: Update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
name: Release
"on":
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
